name: Deploy Visualizer to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'visualizer/**'
      - 'tests/simulate_battle.py'
      - 'src/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Copy Python files for WASM simulator
        run: |
          mkdir -p visualizer/data/src
          mkdir -p visualizer/data/tests
          cp -r src/* visualizer/data/src/
          cp tests/simulate_battle.py visualizer/data/tests/
          python3 -c "import os, json; files = [os.path.relpath(os.path.join(r, f), 'visualizer/data').replace('\\\\', '/') for r, d, fs in os.walk('visualizer/data') for f in fs if f.endswith('.py')]; open('visualizer/data/manifest.json', 'w').write(json.dumps(files, indent=2))"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'visualizer'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
